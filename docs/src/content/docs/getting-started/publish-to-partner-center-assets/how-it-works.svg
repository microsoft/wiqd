<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
  <title id="t">How publishing to Partner Center works</title>
  <desc id="d">Three lanes. Partner Center portal: enroll, get verified, Microsoft 365 and Copilot program ready. wiqd in your terminal: auth login, pc init, validate the exact ZIP, pc preflight and pc prepare with the same package and release notes, pc submit with separate consent, then pc status. Microsoft decides certification and Live publication. For rejection, fix the findings, preview and apply explicit pc update selectors, then review and resubmit in the Partner Center portal.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/>
    </marker>
    <linearGradient id="hl" x1="0" x2="1">
      <stop offset="0" stop-color="#4ECDC4"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="960" height="470" rx="12" fill="#17151e"/>
  <rect x="0" y="0" width="960" height="4" fill="url(#hl)"/>

  <!-- Lanes -->
  <rect x="16" y="24" width="928" height="110" rx="10" fill="#1e1b29" stroke="#38363f"/>
  <rect x="16" y="148" width="928" height="150" rx="10" fill="#1e1b29" stroke="#38363f"/>
  <rect x="16" y="312" width="928" height="140" rx="10" fill="#1e1b29" stroke="#38363f"/>

  <g fill="#8b8b96" font-size="12" font-weight="700" letter-spacing="1">
    <text x="32" y="74">PARTNER</text><text x="32" y="90">CENTER</text><text x="32" y="106" font-weight="400" font-size="11">(portal)</text>
    <text x="32" y="216">WIQD</text><text x="32" y="232" font-weight="400" font-size="11">(your</text><text x="32" y="246" font-weight="400" font-size="11">terminal)</text>
    <text x="32" y="378">MICROSOFT</text>
  </g>

  <!-- Partner Center lane -->
  <g font-size="13" fill="#eeeef0" text-anchor="middle">
    <rect x="160" y="54" width="170" height="52" rx="8" fill="#26242d" stroke="#4ECDC4"/>
    <text x="245" y="77">Enroll</text><text x="245" y="95" font-size="11" fill="#c2c2c6">publisher profile</text>
    <rect x="370" y="54" width="170" height="52" rx="8" fill="#26242d" stroke="#4ECDC4"/>
    <text x="455" y="77">Get verified</text><text x="455" y="95" font-size="11" fill="#c2c2c6">legal + company info</text>
    <rect x="580" y="54" width="220" height="52" rx="8" fill="#26242d" stroke="#4ECDC4"/>
    <text x="690" y="77">Program ready</text><text x="690" y="95" font-size="11" fill="#c2c2c6">Microsoft 365 and Copilot</text>
  </g>
  <g stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="330" y1="80" x2="366" y2="80"/>
    <line x1="540" y1="80" x2="576" y2="80"/>
  </g>
  <text x="820" y="76" font-size="11" fill="#fbbf24">Start first:</text>
  <text x="820" y="91" font-size="11" fill="#fbbf24">can take days</text>

  <!-- handoff to wiqd -->
  <path d="M690,106 L690,128 L210,128 L210,196" stroke="#c084fc" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="440" y="122" font-size="11" fill="#c2c2c6" text-anchor="middle">then sign in to your seller tenant</text>

  <!-- wiqd lane -->
  <g font-size="12" fill="#eeeef0" text-anchor="middle">
    <rect x="150" y="200" width="120" height="56" rx="8" fill="#26242d" stroke="#a855f7"/>
    <text x="210" y="224">auth login</text><text x="210" y="242" font-size="10" fill="#c2c2c6">--interactive</text>
    <rect x="282" y="200" width="112" height="56" rx="8" fill="#26242d" stroke="#a855f7"/>
    <text x="338" y="224">pc init</text><text x="338" y="242" font-size="10" fill="#c2c2c6">fill details</text>
    <rect x="406" y="200" width="112" height="56" rx="8" fill="#26242d" stroke="#a855f7"/>
    <text x="462" y="224">pc preflight</text><text x="462" y="242" font-size="10" fill="#c2c2c6">changes nothing</text>
    <rect x="530" y="200" width="120" height="56" rx="8" fill="#26242d" stroke="#a855f7" stroke-width="2"/>
    <text x="590" y="224">pc prepare</text><text x="590" y="242" font-size="10" fill="#c2c2c6">Draft + uploads</text>
    <rect x="662" y="200" width="120" height="56" rx="8" fill="#26242d" stroke="#a855f7" stroke-width="2"/>
    <text x="722" y="224">pc submit</text><text x="722" y="242" font-size="10" fill="#c2c2c6">to certification</text>
    <rect x="794" y="200" width="134" height="56" rx="8" fill="#26242d" stroke="#a855f7"/>
    <text x="861" y="224">pc status</text><text x="861" y="242" font-size="10" fill="#c2c2c6">--watch</text>
  </g>
  <g stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="270" y1="228" x2="279" y2="228"/>
    <line x1="394" y1="228" x2="403" y2="228"/>
    <line x1="518" y1="228" x2="527" y2="228"/>
    <line x1="650" y1="228" x2="659" y2="228"/>
    <line x1="782" y1="228" x2="791" y2="228"/>
  </g>
  <!-- confirmation gates -->
  <g font-size="10" text-anchor="middle">
    <rect x="545" y="168" width="90" height="22" rx="11" fill="#1e1033" stroke="#fbbf24"/>
    <text x="590" y="183" fill="#fbbf24">gate: --yes</text>
    <rect x="667" y="168" width="110" height="22" rx="11" fill="#1e1033" stroke="#fbbf24"/>
    <text x="722" y="183" fill="#fbbf24">gate: type submit</text>
  </g>
  <text x="150" y="282" font-size="11" fill="#8b8b96">Validate the ZIP first; pass the same --package and --release-notes to preflight and prepare.</text>

  <!-- Microsoft lane -->
  <g font-size="13" fill="#eeeef0" text-anchor="middle">
    <rect x="530" y="342" width="150" height="52" rx="8" fill="#26242d" stroke="#6366F1"/>
    <text x="605" y="365">Certification</text><text x="605" y="383" font-size="11" fill="#c2c2c6">automated + manual</text>
    <rect x="712" y="342" width="90" height="52" rx="8" fill="#26242d" stroke="#6366F1"/>
    <text x="757" y="373">Live</text>
    <rect x="828" y="342" width="100" height="52" rx="8" fill="#26242d" stroke="url(#hl)" stroke-width="2"/>
    <text x="878" y="365">Agent</text><text x="878" y="383">Store</text>
  </g>
  <path d="M722,256 L722,300 L605,300 L605,338" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <g stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="680" y1="368" x2="709" y2="368"/>
    <line x1="802" y1="368" x2="825" y2="368"/>
  </g>

  <!-- rejection loop -->
  <rect x="150" y="342" width="300" height="52" rx="8" fill="#26242d" stroke="#f472b6" stroke-dasharray="5 4"/>
  <text x="300" y="365" font-size="12" fill="#f9a8d4" text-anchor="middle">Rejected? Fix it, then</text>
  <text x="300" y="383" font-size="11" fill="#f9a8d4" text-anchor="middle">update: preview, apply; submit in portal</text>
  <line x1="530" y1="368" x2="454" y2="368" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="492" y="360" font-size="10" fill="#f9a8d4" text-anchor="middle">feedback</text>
  <text x="150" y="428" font-size="11" fill="#8b8b96">Submitted isn't published: published is true only once wiqd sees the offer Live.</text>
</svg>
