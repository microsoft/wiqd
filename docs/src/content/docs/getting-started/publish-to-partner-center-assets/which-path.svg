<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
  <title id="t">Which publishing path should I use?</title>
  <desc id="d">Who should get your plugin? Testers: wiqd plugin share. Your organization: wiqd plugin publish with a lifecycle environment. Public store: supported declarative-agent packages use wiqd publish pc for submission; Microsoft decides certification and store publication. Standalone skill or connector-only plugins use portal submission.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
    </marker>
    <linearGradient id="hl" x1="0" x2="1">
      <stop offset="0" stop-color="#4ECDC4"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" rx="12" fill="#17151e"/>
  <rect x="0" y="0" width="960" height="4" fill="url(#hl)"/>

  <rect x="330" y="24" width="300" height="50" rx="25" fill="#1e1033" stroke="#c084fc" stroke-width="2"/>
  <text x="480" y="55" font-size="15" fill="#eeeef0" text-anchor="middle">Who should get your plugin?</text>

  <g stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M400,74 L170,128"/>
    <path d="M480,74 L480,128"/>
    <path d="M560,74 L790,128"/>
  </g>
  <g font-size="12" fill="#c2c2c6" text-anchor="middle">
    <text x="250" y="100">Just me or testers</text>
    <text x="545" y="108">My organization</text>
    <text x="715" y="100">Everyone, publicly</text>
  </g>

  <g text-anchor="middle">
    <rect x="40" y="132" width="260" height="130" rx="10" fill="#26242d" stroke="#585861"/>
    <text x="170" y="164" font-size="14" fill="#eeeef0">Share</text>
    <text x="170" y="192" font-size="12" fill="#c084fc">wiqd plugin share</text>
    <text x="170" y="220" font-size="11" fill="#8b8b96">Named users or your tenant.</text>
    <text x="170" y="238" font-size="11" fill="#8b8b96">No catalog, no certification.</text>

    <rect x="350" y="132" width="260" height="130" rx="10" fill="#26242d" stroke="#585861"/>
    <text x="480" y="164" font-size="14" fill="#eeeef0">Org app catalog</text>
    <text x="480" y="192" font-size="12" fill="#c084fc">wiqd plugin publish --env</text>
    <text x="480" y="220" font-size="11" fill="#8b8b96">Your tenant admin approves it.</text>
    <text x="480" y="238" font-size="11" fill="#8b8b96">Stays inside your org.</text>

    <rect x="660" y="132" width="260" height="130" rx="10" fill="#26242d" stroke="url(#hl)" stroke-width="2.5"/>
    <text x="790" y="164" font-size="14" fill="#eeeef0">Partner Center</text>
    <text x="790" y="192" font-size="12" fill="#c084fc">wiqd publish pc</text>
    <text x="790" y="220" font-size="11" fill="#8b8b96">Declarative-agent submission.</text>
    <text x="790" y="238" font-size="11" fill="#8b8b96">Microsoft decides certification.</text>
  </g>
  <text x="790" y="284" font-size="11" fill="#fbbf24" text-anchor="middle">You are here</text>
</svg>
